<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AviatorX Predictor</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #0d0f12;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        .card {
            background: #171a21;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            text-align: center;
            width: 85%;
            max-width: 350px;
            border: 1px solid #2a2e39;
        }

        .title {
            font-size: 24px;
            font-weight: bold;
            color: #e53935;
            margin-bottom: 20px;
        }

        /* Circle / Radar Style */
        .radar-box {
            width: 140px;
            height: 140px;
            border: 3px solid #e53935;
            border-radius: 50%;
            margin: 0 auto 20px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            background: radial-gradient(circle, rgba(229,57,53,0.1) 0%, rgba(0,0,0,0) 70%);
        }

        .radar-box::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px dashed rgba(229, 57, 53, 0.4);
        }

        .multiplier {
            font-size: 32px;
            font-weight: bold;
            color: #ffffff;
        }

        .btn {
            background-color: #0088cc;
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            transition: background 0.3s;
        }

        .btn:active {
            background-color: #006699;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="title">AviatorX</div>
        
        <div class="radar-box">
            <div class="multiplier" id="signal">0.00X</div>
        </div>

        <button class="btn" onclick="getSignal()">Bashorat qiling</button>
    </div>

    <script>
        // Init Telegram Web App
        window.Telegram.WebApp.ready();

        function getSignal() {
            const display = document.getElementById('signal');
            display.style.color = "#ffb74d";
            display.innerText = "Wait...";

            setTimeout(() => {
                // Generate random multiplier (e.g., between 1.20x and 12.00x)
                const val = (Math.random() * (12.00 - 1.20) + 1.20).toFixed(2);
                display.style.color = "#4caf50";
                display.innerText = val + "X";
            }, 1200);
        }
    </script>
</body>
</html>
